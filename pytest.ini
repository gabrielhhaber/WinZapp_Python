[pytest]
testpaths = tests
pythonpath = client
asyncio_mode = auto
markers =
    wxgui: creates a real top-level wx window (see below)
    slow: tests that run migration on large datasets
    integration: tests that require a real wx.App
    load: synthetic load tests with configurable scenario size
    docs: assertions about documentation matching the code; deselected by release.yml
         so a stale Markdown sentence can never delete a stable release
