[project]
name = "winzapp"
version = "0.0.0"
description = "Accessible, self-hosted Windows WhatsApp desktop client"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "accessible-output2==0.17",
    "aiofiles==25.1.0",
    "aiosqlite==0.22.1",
    "altgraph==0.17.5",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "audioop-lts==0.2.1",
    "anyio==4.12.0",
    "av==18.1.0",
    "bidict==0.23.1",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.5.0",
    "comtypes==1.4.16",
    "colorama==0.4.6",
    "cryptography==46.0.3",
    "ctranslate2==4.8.2",
    "fastapi==0.123.4",
    "faster-whisper==1.2.1",
    "filelock==3.32.5",
    "flatbuffers==25.12.19",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.30.0",
    "idna==3.11",
    "iniconfig==2.3.0",
    "libloader==1.4.2",
    "livekit==1.1.20",
    "numpy==2.3.5",
    "onnxruntime==1.29.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "packaging==25.0",
    "pefile==2024.8.26",
    "pillow==12.3.0",
    "platform-utils==1.6.0",
    "platformdirs==4.5.0",
    "pluggy==1.6.0",
    "protobuf==7.36.1",
    "pyaudio==0.2.14; python_version < '3.14'",
    "pycparser==2.23",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.20.0",
    "pyperclip==1.11.0",
    "python-dotenv==1.2.1",
    "python-engineio==4.12.3",
    "python-socketio==5.15.1",
    "pywin32==311",
    "pywin32-ctypes==0.2.3",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "setuptools==80.9.0",
    "simple-websocket==1.1.0",
    "sound-lib==0.83",
    "sounddevice==0.5.5",
    "soundfile==0.13.1",
    "starlette==0.50.0",
    "tokenizers==0.23.2",
    "tqdm==4.70.0",
    "truststore==0.10.4",
    "types-protobuf==7.35.1.20260906",
    "typing-inspection==0.4.2",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0",
    "uvicorn==0.38.0",
    "websocket-client==1.9.0",
    "websockets==15.0.1",
    "windows-toasts==1.3.1",
    "winrt-runtime==3.2.1",
    "winrt-windows.data.xml.dom==3.2.1",
    "winrt-windows.foundation==3.2.1",
    "winrt-windows.foundation.collections==3.2.1",
    "winrt-windows.ui.notifications==3.2.1",
    "wsproto==1.3.2",
    "wxpython==4.2.4",
    "zstandard==0.25.0",
]

[project.scripts]
api = "winzapp_tools.cli:api"
setup-api = "winzapp_tools.cli:setup_api"
setup-neonize = "winzapp_tools.cli:setup_neonize"
winzapp = "winzapp_tools.cli:app"
build-onefile = "winzapp_tools.cli:build_onefile"
build-installer = "winzapp_tools.cli:build_installer"
test = "winzapp_tools.cli:test"
translations-update = "winzapp_tools.cli:translations_update"
translations-check = "winzapp_tools.cli:translations_check"
translations-check-draft = "winzapp_tools.cli:translations_check_draft"
translations-compile = "winzapp_tools.cli:translations_compile"

[dependency-groups]
dev = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "coverage==7.14.3",
    "execnet==2.1.2",
    "frozenlist==1.8.0",
    "multidict==7.2.1",
    "polib==1.2.0",
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "propcache==0.5.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "yarl==1.25.1",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["winzapp_tools"]
