name: Stable Release Published

# Runs once a stable release is actually out — the maintainer published the
# draft release.yml built (normally through
# `.github/scripts/release_signing.py sign-stable`). It used to be release.yml's
# last job, running as soon as assets were uploaded; with releases now left as
# drafts until they are signed, bumping main at that point would advertise a
# version nobody can install yet.
#
# Alpha releases never reach this: alpha-release.yml publishes with
# GITHUB_TOKEN, which does not trigger workflows, and the `if` below skips an
# alpha published by any other means.

on:
  release:
    types: [published]

jobs:
  # Push the version.py bump back to the default branch so the repo reflects
  # the version that was actually released, not just the build artifacts.
  #
  # RELEASE_BUMP_TOKEN is a fine-grained PAT (Contents: Read/write on this repo
  # only, no Workflows permission) belonging to an account whose RepositoryRole
  # bypasses the ruleset that requires PRs on main; the default GITHUB_TOKEN has
  # no bypass path. GitHub has no per-file scoping for a PAT, so containment is
  # keeping its exposure minimal — checkout, write one file, commit — AND
  # reading it from the `release` environment rather than from repository
  # secrets. A repository secret is readable by a workflow pushed to any branch
  # by anyone with write access; an environment secret can be restricted in
  # Settings > Environments > release to the stable tags (`v*[0-9]` and
  # `v*beta` — creating those is admin-only by the tag ruleset, while `v*alpha`
  # tags are not).
  bump-version:
    name: Bump version.py in the repository
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.release.tag_name, 'alpha') && !github.event.release.prerelease }}
    environment: release
    # actions: write is only for the "Trigger a fresh alpha build" step below
    # (a workflow_dispatch API call, not a push/release GITHUB_TOKEN would
    # raise itself — so it does not re-trigger this same workflow).
    permissions:
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          token: ${{ secrets.RELEASE_BUMP_TOKEN }}

      - name: Set version.py from release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="${TAG#v}"
          ver="${ver#V}"
          printf '__version__ = "%s"' "$ver" > client/version.py
          echo "[INFO] version.py set to $ver"

      - name: Commit version.py bump back to the repository
        id: commit_version
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        continue-on-error: true
        with:
          commit_message: "chore: bump version to ${{ github.event.release.tag_name }} [skip ci]"
          file_pattern: client/version.py
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      # Stable releases are cut from release/x.x.x.x branches, which lag
      # behind main — main can already carry commits/features (and their
      # alpha builds) that this stable release deliberately doesn't include.
      # Without this step, the alpha channel's newest build stays pinned to
      # the OLD version base until the next unrelated push to main, while
      # this job's own commit above already made client/version.py on main
      # report the NEW stable's number. Since select_release() in
      # client/updater.py picks the newest release purely by parsed version
      # number, alpha users would be pulled onto this stable release the
      # moment it's published — even though it may contain less than what
      # they're already running, silently dropping features back out.
      #
      # Dispatching alpha-release.yml here (its workflow_dispatch trigger,
      # normally used for manual re-runs) immediately builds current main —
      # which still has everything the previous alpha had — under the just-
      # bumped base, producing X.Y.Z.<commit count>alpha. That build number
      # is never 0, so it outranks this stable's X.Y.Z.0 right away.
      #
      # Skipped if the commit above didn't actually land (e.g. a ruleset
      # rejected the push) — dispatching off a version.py that still holds
      # the OLD base wouldn't accomplish anything.
      - name: Trigger a fresh alpha build off the new stable base
        if: steps.commit_version.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run alpha-release.yml --repo "${{ github.repository }}" --ref main
