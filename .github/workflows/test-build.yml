# Branch test build — a real, CI-produced WinZapp from any branch, on demand.
#
# The point is to stop trusting a local build.py when trying out a branch: this
# runs the same test suite and the same build pipeline a release does (they all
# call build-windows.yml), so what you download is built the way the shipped
# artifacts are built, on a clean machine, with the suite confirmed green.
#
# What it deliberately does NOT do is create a release. The result is an
# ARTIFACT, and client/updater.py reads the Releases API — so a test build is
# invisible to it by construction. There is no way for a branch build to be
# offered to a user, not even one on the alpha channel. It also leaves no tag
# and no entry on the Releases page, and expires on its own.
#
# Run it from the web (Actions > Branch test build > Run workflow, pick the
# branch) or from the CLI:
#
#   gh workflow run test-build.yml --ref feat/group-media-tab
#   gh run watch $(gh run list --workflow=test-build.yml --limit 1 --json databaseId --jq '.[0].databaseId')
#   gh run download <run-id> -n winzapp-test-build
#
# `--ref` is what picks the branch: a workflow_dispatch runs the workflow file
# from that ref and builds that ref.
name: Branch test build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test suite first (leave on unless you know why not)
        required: false
        type: boolean
        default: true
      retention_days:
        description: Days to keep the downloadable build
        required: false
        type: string
        default: "14"

# One test build at a time per branch. A second dispatch of the same branch
# supersedes the first rather than queueing behind ten minutes of work nobody
# is waiting for any more. Different branches build in parallel.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Same gate the release pipelines use, and for the same reason: it is cheap,
  # it fails fast, and a branch that cannot pass its own tests is not worth ten
  # minutes of build. Skippable only through an explicit input, for the case
  # where you are deliberately building a branch with a known-red suite to look
  # at the UI.
  test:
    name: Run test suite
    if: inputs.run_tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          pip install -r requirements-dev.txt --quiet

      - name: Run pytest
        run: pytest --run-wx-gui

  build:
    # always() so the build still runs when `test` was skipped by run_tests
    # being false — without it, a skipped dependency skips this job too. The
    # result check is what still stops a FAILED suite from producing a build.
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/build-windows.yml
    with:
      # No version is passed on purpose: the build keeps whatever
      # client/version.py already holds on the branch. A test build must not
      # claim a version of its own — that is what keeps it unorderable against
      # real releases and impossible to confuse with one.
      artifact-name: winzapp-test-build
      retention-days: ${{ fromJSON(inputs.retention_days) }}

  # A build whose suite was skipped is easy to mistake for a normal one weeks
  # later, when only the artifact is left. Say so in the run summary, which is
  # what you actually look at when picking a run to download.
  summary:
    needs: [test, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write the run summary
        shell: bash
        run: |
          {
            echo "## Branch test build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "| Test suite | passed |"
            else
              echo "| Test suite | **SKIPPED — this build was not verified** |"
            fi
            echo
            echo "Download \`winzapp-test-build\` from this run's Artifacts."
            echo "It contains \`WinZapp.zip\`, the installer, and \`SHA256SUMS.txt\`."
            echo
            echo "This is **not** a release: it has no tag, it is not on the"
            echo "Releases page, and the in-app updater cannot see it."
          } >> "$GITHUB_STEP_SUMMARY"
