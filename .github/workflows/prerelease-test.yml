# Workflow de PRÉ-RELEASE DE TESTE — branch joaopr4
# Cópia do release.yml adaptada para:
#   - disparo APENAS manual (workflow_dispatch) — nunca automático
#   - checkout/build na branch joaopr4
#   - push de volta para joaopr4 (NUNCA para main)
#   - tag com sufixo -pre (não colide com releases oficiais)
#   - prerelease: true → o auto-updater (releases/latest) IGNORA esta release
name: Pre-release de Teste (joaopr4)

on:
  push:
    branches: [ joaopr4 ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da Pré-release (Deixe em branco para usar a data/hora atual)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Código-Fonte (joaopr4)
        uses: actions/checkout@v4
        with:
          ref: joaopr4
          fetch-depth: 1

      - name: Definir Versão da Pré-release
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrEmpty($ver)) {
              $ver = Get-Date -Format "yyyy.MM.dd.HHmm"
          }
          $ver = "$ver-pre"
          echo "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "[INFO] Versão definida para: $ver"

      - name: Atualizar versão no version.py
        shell: pwsh
        run: |
          $ver = "${{ env.RELEASE_VERSION }}"
          $filePath = "client/version.py"
          $content = "__version__ = `"$ver`""
          $content | Out-File -FilePath $filePath -Encoding utf8 -NoNewline
          Write-Output "[INFO] Arquivo version.py atualizado para a versão $ver."

      - name: Configurar Git, Commit e Tag (na joaopr4)
        shell: pwsh
        run: |
          $ver = "${{ env.RELEASE_VERSION }}"
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add client/version.py
          git commit -m "[skip ci] chore: bump version to $ver"
          git tag "v$ver"
          git push origin HEAD:joaopr4
          git push origin "v$ver"
          Write-Output "[INFO] Alterações enviadas para joaopr4 e tag v$ver criada."

      - name: Configurar Arquivos .env
        shell: pwsh
        run: |
          $envContent = @"
          WPPCONNECT_TAG_VERSION=v2.10.4
          WPP_MINIMUM_VERSION=2.10.4
          LICENSING_USER_EMAIL=gabrielhaberkamp@gmail.com
          "@
          $envContent | Out-File -FilePath ".env" -Encoding utf8
          $envContent | Out-File -FilePath "client/.env" -Encoding utf8
          Write-Output "[INFO] Arquivos .env criados para o build."

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache Node.js Portátil
        id: cache-node
        uses: actions/cache@v4
        with:
          path: client/node
          key: node-portable-v22.22.2

      - name: Cache MinGit Portátil
        id: cache-git
        uses: actions/cache@v4
        with:
          path: client/git
          key: mingit-portable-v2.44.0

      - name: Cache Node Modules da WPPConnect API
        id: cache-api-modules
        uses: actions/cache@v4
        with:
          path: client/api/node_modules
          key: npm-packages-${{ hashFiles('client/api_patches/package.json') }}
          restore-keys: |
            npm-packages-

      - name: Cache Chrome do Puppeteer
        id: cache-puppeteer-chrome
        uses: actions/cache@v4
        with:
          path: client/api/.cache
          key: puppeteer-chrome-${{ hashFiles('client/api_patches/package.json') }}

      - name: Executar Master Builder (Prepara Ambiente, Node, MinGit, DLLs e API)
        run: |
          python builder.py

      - name: Compilar WinZapp com PyInstaller e Gerar Instalador
        shell: pwsh
        run: |
          python build.py

      - name: Criar GitHub PRÉ-RELEASE e Fazer Upload dos Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "PRÉ-RELEASE DE TESTE — Versão ${{ env.RELEASE_VERSION }}"
          files: |
            dist/WinZappInstaller.exe
            dist/WinZapp.zip
          generate_release_notes: true
          prerelease: true
