# Roda a suíte de testes em todo PR para a main.
#
# Até aqui os testes só rodavam DEPOIS do merge, no job `test` do
# alpha-release.yml (e no release.yml, num release já criado). Ou seja: um PR
# quebrado passava pela única barreira que existe — uma aprovação humana — e o
# problema só aparecia quando o código já estava na main e a alpha publicada.
# Este workflow move essa descoberta para enquanto o PR ainda está aberto e dá
# para consertar.
#
# É uma cópia deliberada do job `test` do alpha-release.yml. Mantenha os dois
# em sincronia: divergir faria um PR passar aqui e a alpha quebrar no merge,
# que é exatamente a surpresa que este arquivo existe para evitar.
#
# Só `pull_request`, não `push`: um vermelho em rascunho é o tipo de alarme que
# o time aprende a ignorar, e `pull_request` é a única forma que pode virar
# check obrigatório no ruleset (um admin precisa marcá-lo lá — enquanto isso
# ele informa, mas não bloqueia o merge).
name: CI

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  GO_VERSION: "1.27.x"

# Um push novo no PR cancela a execução anterior: só o último commit interessa.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The suite in 4 jobs at once, each with one pytest worker per vCPU
  # (-n auto). Every test module lands in exactly one shard, and the modules
  # that put real wx windows up run one after another on a single worker
  # (tests/ci_shards.py). --durations lists each shard's slowest tests, so
  # the next slowdown has a name. One job ran ~22,000 tests in ~25 minutes.
  test-shard:
    name: Run test suite (shard ${{ matrix.shard }}/4)
    strategy:
      # Every shard to the end: one run reports every failure, not the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv itself, pinned like every action: "latest" would let a release
          # build change toolchains on the day uv ships.
          version: "0.12.13"

      - name: Install Python dependencies
        run: uv sync --locked

      # client/api/ não existe aqui (é git-ignored e não há clone da
      # WPPConnect), então os testes que comparam as duas cópias dos patches se
      # pulam sozinhos — vide test_api_patches_in_sync.py. Isso é esperado: a
      # deriva que eles pegam só é detectável numa máquina de dev.
      # O comtypes cria o próprio cache no primeiro import; com -n auto vários
      # workers corriam para criar a mesma pasta (FileExistsError na coleta).
      - name: Warm the comtypes cache
        run: uv run python -c "import comtypes.client"
      - name: Run pytest
        run: uv run pytest --run-wx-gui -n auto --shard ${{ matrix.shard }}/4 --durations=20

  # The suite's single verdict, under the name every `needs: test` and the
  # branch ruleset already use: it fails when any shard did not pass.
  test:
    name: Run test suite
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.test-shard.result }}" = "success"

  # O fluxo venv + pip continua suportado ao lado do uv: checkouts antigos,
  # forks e scripts instalam só `requirements.txt`. O job `test` acima usa uv,
  # então nada exercitaria esse caminho — um pin que o pip não consegue
  # resolver ou instalar no Windows passaria despercebido até alguém de fora
  # reclamar. test_requirements_in_sync.py garante que as duas listas dizem o
  # mesmo; este job garante que a do pip de fato instala e importa.
  # Só no CI de PR, de propósito: alpha-release.yml e release.yml não precisam
  # dele para decidir se um build vale a pena.
  pip-compat:
    name: venv + pip install
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from requirements.txt into a venv
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip --quiet
          venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt --quiet

      - name: Import what the app and the build need
        run: venv\Scripts\python.exe -c "import wx, accessible_output2, sound_lib, cryptography, aiosqlite, socketio, PyInstaller, pytest_asyncio; print('ok')"

      - name: Run the dependency and build-environment checks under the venv
        run: venv\Scripts\python.exe -m pytest tests/test_requirements_in_sync.py tests/test_uv_build_architecture.py --run-wx-gui -q

  # The Neonize bridge (neonize_bridge/) has its own suite, its own
  # pytest.ini and its own dependencies; the root `pytest` only collects
  # `tests/`, so none of the other jobs runs it. That suite holds the tests of
  # the local port's authentication (neonize_bridge/test_authentication*.py),
  # of the extraction of the prepare.py zip and of the one-handler-per-event rule
  # of neonize: without this job, a regression in them would go green.
  # It runs against the neonize the bridge runs every day: WinZapp's build
  # (official neonize plus neonize_patches/, compiled by build_neonize.py), never
  # PyPI's, which lacks the events and functions the bridge relies on.
  # Only on PR CI, like pip-compat. To block the merge, an admin has to mark
  # "Neonize bridge tests" in the ruleset (the `Run test suite` aggregate does not
  # include this job on purpose: whoever does not use the bridge should not depend on it).
  neonize-bridge:
    name: Neonize bridge tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up MSYS2 (64-bit GCC for cgo)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MSYS2 UCRT64 bin to Windows PATH
        shell: msys2 {0}
        run: echo "$(cygpath -w /ucrt64/bin)" >> "$GITHUB_PATH"

      - name: Build WinZapp's neonize (the one the bridge runs)
        run: python neonize_bridge/build_neonize.py all

      - name: Run synthetic native call-audio regressions
        env:
          CGO_ENABLED: "0"
        run: |
          Push-Location neonize_bridge/neonize_build/neonize/goneonize
          go test -p 1 -count=1 calls_pcm.go calls_audio_format.go calls_pcm_test.go calls_audio_format_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location neonize_bridge/neonize_build/meowcaller
          go test -p 1 -count=1 -run 'Test(PCM48|NegotiatedCall|OpusCall|LateCallCodec|AudioReorder|OpusTimestamp|ReceiveAudio|ConfigureCodec|Participant|AudioPlayout|MediaPipeline)' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Install the bridge's requirements, the test tooling and that neonize into a venv
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip --quiet
          venv\Scripts\python.exe -m pip install --require-hashes -r neonize_bridge/requirements.lock --quiet
          venv\Scripts\python.exe -m pip install -r requirements-dev.txt --quiet
          python neonize_bridge/build_neonize.py install --venv venv

      - name: Run the bridge's tests
        run: venv\Scripts\python.exe -m pytest neonize_bridge -q
