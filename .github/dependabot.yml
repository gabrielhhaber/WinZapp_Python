# Keeps the commit-SHA pins in .github/workflows current.
#
# Every third-party action is pinned to a full commit SHA rather than a tag,
# because a tag can be moved to different code after the fact (the 2025
# tj-actions/changed-files compromise did exactly that) and several of these
# run with `contents: write` or a release token. A pin nobody updates rots,
# though, so Dependabot proposes the bump as a PR — which still needs review
# like any other change to a workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
